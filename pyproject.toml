[build-system]
# >=77 才认 PEP 639 的 license/license-files 字符串形式（旧写法在新 setuptools 上已是弃用告警）
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-kit"
description = "中低频 Alpha 研究与回测引擎：统一 Node 模型、Zarr L3 存储、ops 链、precise 仿真"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "QL" }]
# manual.md §2.1 承诺「只需要 Python 3.11+」——这里是那句话的可执行版本
requires-python = ">=3.11"

# 下界取本仓库实测跑通的版本, 不写 `*` 也不虚报兼容性: 引擎读写 zarr v3 布局、
# 依赖 pandas 3 的 copy-on-write 语义（ops 链「永远返回副本」的前提），装低了不是慢是错。
# numpy 由 pandas 拉进来, 故不单列; pyarrow 是 dump/pnl 四交付物的 feather 后端。
dependencies = [
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "zarr>=3.3.0",
    "PyYAML>=6.0.3",
]

# 版本号的唯一真相在 alpha_kit/__init__.py，避免两处各写一份然后对不上
dynamic = ["version"]

[project.scripts]
# architecture.md §十二 与 manual.md 通篇写的都是 `alphakit run …`；
# 有了这一行它才不再是文档里的一个 shell 函数别名。
alphakit = "alpha_kit.cli:main"
# `run` / `pnl` 直呼其名：日常只用到这两个动词, 每次多敲一次 `alphakit` 纯是负担。
# 名字很通用, 故只在本 venv 内生效——这也正是应当用 venv 而非 --user 装它的理由。
ak = "alpha_kit.cli:main"
run = "alpha_kit.cli:main_run"
pnl = "alpha_kit.cli:main_pnl"

[tool.setuptools]
# 显式列包, 不用 auto-discovery: 仓库根下的 repos/ pipeline/ storage/ tests/ 都带 .py,
# 自动发现会把研究仓库和摄入脚本一起打进 wheel（storage/ 更是几十 MB 数据）。
# §二 的原则是 alpha_kit 为纯引擎——这一行是那条边界的物理执行。
packages = [
    "alpha_kit",
    "alpha_kit.core",
    "alpha_kit.runner",
    "alpha_kit.pnl",
]

[tool.setuptools.dynamic]
version = { attr = "alpha_kit.__version__" }

[tool.ruff]
# 只针对引擎与测试。pipeline/ 将来独立成 repo, 到时带走自己的配置。
target-version = "py311"      # 与 requires-python 同一个下界: 承诺要能被机器检查
line-length = 100

[tool.ruff.lint]
# 选的是**会咬人的**那些, 不是风格。这个仓库的排版是有意的（对齐的注释块、
# 刻意的换行位置）, 把 UP/I/Q 一类打开只会得到几百条无意义的改动, 然后没人再看
# lint 的输出——一个总是红的检查等于没有检查。
#   F   pyflakes: 未用的导入/变量、名字拼错
#   E9  语法错（含"这个语法你的 requires-python 还不支持"）
#   B   bugbear: 循环变量闭包、可变默认值这类真 bug
#   PLE pylint 的 error 档
select = ["F", "E9", "B", "PLE"]
ignore = [
    "B905",   # zip(strict=) —— 3.10+ 才有, 且此处长度相等由轴保证
    "B028",   # warnings.warn 不带 stacklevel: 引擎的告警面向使用者而非调用栈
]

[tool.ruff.lint.per-file-ignores]
# 测试里 sys.path 插入必须在 import 之前, 且断言计数用模块级 global
"tests/*" = ["E402", "B011"]
